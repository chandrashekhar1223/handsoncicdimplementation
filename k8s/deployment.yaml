apiVersion: apps/v1
kind: Deployment
metadata:
  name: demoapp

spec:
  replicas: 2
  selector:
    matchLabels:
      app: demoapp

  template:
    metadata:
      labels:
        app: demoapp

    spec:
      containers:
      - name: demoapp
        image: demoacr12345.azurecr.io/demoapp:v1
        ports:
        - containerPort: 8080